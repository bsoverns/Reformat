name: Build WPF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WpfReformat/WpfReformat.sln

      - name: Build
        run: dotnet build WpfReformat/WpfReformat.sln -c Release --no-restore

      - name: Test
        run: dotnet test WpfReformat/WpfReformat.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Publish single-file exe
        run: dotnet publish WpfReformat/WpfReformat/WpfReformat.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Upload Reformat.exe
        uses: actions/upload-artifact@v4
        with:
          name: Reformat-win-x64
          path: publish/Reformat.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
